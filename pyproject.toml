[project]
name = "golfswing"
version = "0.1.0"
description = "Local golf swing video analyzer — named faults + metrics from down-the-line footage"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

# Declared explicitly. Without this, setuptools' flat-layout auto-discovery
# treats data/, models/ and outputs/ as packages and refuses to build.
[tool.setuptools]
packages = ["golfswing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
