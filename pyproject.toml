[project]
name = "golfswing"
version = "0.1.0"
description = "Measures what your body did in a golf swing from down-the-line video, and ranks each swing against the ones you struck well"
requires-python = ">=3.11"
# Every third-party import in the project. Previously only the first four were
# declared, so a fresh clone installed cleanly and then crashed on `import
# streamlit` — the setup instructions did not actually work.
dependencies = [
    "mediapipe",        # pose estimation
    "opencv-python",    # video decode, drawing
    "numpy",
    "scipy",            # Savitzky-Golay smoothing
    "streamlit",        # the UI
    "matplotlib",       # distribution and trend charts
    "PyYAML",           # thresholds.yaml
    "Pillow",           # app icon builder
    "pywebview",        # native macOS window (desktop.py)
    "anthropic",        # optional coaching note; unused without an API key
]

[project.optional-dependencies]
dev = ["pytest"]

# Declared explicitly. Without this, setuptools' flat-layout auto-discovery
# treats data/, models/ and outputs/ as packages and refuses to build.
[tool.setuptools]
packages = ["golfswing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
